name: Nightly Scrape

on:
  schedule:
    # Run at 3 AM Serbian time (2:00 UTC in winter, 1:00 UTC in summer)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

# Scrapers write to Cloudflare D1 through the authenticated /api/ingest endpoint
# (D1 isn't reachable directly from GitHub Actions). Set both as repo secrets:
# INGEST_URL = https://www.vrebajpopust.rs/api/ingest, INGEST_SECRET = the Worker secret.
env:
  INGEST_URL: ${{ secrets.INGEST_URL }}
  INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

jobs:
  # List scrapers run in parallel
  scrape-buzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run Buzz scraper
        run: pnpm tsx src/scraper/stores/buzz.ts
        timeout-minutes: 30

  scrape-officeshoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run Office Shoes scraper
        run: pnpm tsx src/scraper/stores/officeshoes.ts
        timeout-minutes: 30

  scrape-djaksport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run DjakSport scraper
        run: pnpm tsx src/scraper/stores/djaksport.ts
        # Crawls every on-sale item in 4 top-level categories (~360 pages of full
        # page.goto pagination, ~10s each — AJAX is Cloudflare-blocked). A timeout kills
        # the run before it's logged, so leave generous headroom.
        timeout-minutes: 120

  scrape-nsport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run N-Sport scraper
        run: pnpm tsx src/scraper/stores/nsport.ts
        timeout-minutes: 30

  scrape-sportvision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run SportVision scraper
        run: pnpm tsx src/scraper/stores/sportvision.ts
        timeout-minutes: 30

  scrape-intersport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - name: Run Intersport scraper
        run: pnpm tsx src/scraper/stores/intersport.ts
        timeout-minutes: 30

  scrape-trefsport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - name: Run Tref Sport scraper
        run: pnpm tsx src/scraper/stores/trefsport.ts
        timeout-minutes: 30

  # Detail scrapers run in parallel, each waits only for its list scraper
  scrape-buzz-details:
    runs-on: ubuntu-latest
    needs: scrape-buzz
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run Buzz Details
        run: pnpm tsx src/scraper/stores/buzz-details.ts
        timeout-minutes: 180

  scrape-officeshoes-details:
    runs-on: ubuntu-latest
    needs: scrape-officeshoes
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run OfficeShoes Details
        run: pnpm tsx src/scraper/stores/officeshoes-details.ts
        timeout-minutes: 180

  scrape-nsport-details:
    runs-on: ubuntu-latest
    needs: scrape-nsport
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run N-Sport Details
        run: pnpm tsx src/scraper/stores/nsport-details.ts
        timeout-minutes: 180

  scrape-sportvision-details:
    runs-on: ubuntu-latest
    needs: scrape-sportvision
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run SportVision Details
        run: pnpm tsx src/scraper/stores/sportvision-details.ts
        timeout-minutes: 180

  scrape-intersport-details:
    runs-on: ubuntu-latest
    needs: scrape-intersport
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - name: Run Intersport Details
        run: pnpm tsx src/scraper/stores/intersport-details.ts
        timeout-minutes: 180

  scrape-trefsport-details:
    runs-on: ubuntu-latest
    needs: scrape-trefsport
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - name: Run Tref Sport Details
        run: pnpm tsx src/scraper/stores/trefsport-details.ts
        timeout-minutes: 180

  scrape-djaksport-details:
    runs-on: ubuntu-latest
    needs: scrape-djaksport
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run DjakSport Details
        run: pnpm tsx src/scraper/stores/djaksport-details.ts
        timeout-minutes: 180

  # Fails the workflow (and triggers the standard GHA email) when any list-scraper
  # silently produces 0 deals or throws errors. Runs after the list jobs only —
  # we don't wait for details since this signal is most useful within the hour.
  health-check:
    runs-on: ubuntu-latest
    needs:
      - scrape-buzz
      - scrape-officeshoes
      - scrape-djaksport
      - scrape-nsport
      - scrape-sportvision
      - scrape-intersport
      - scrape-trefsport
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - name: Check scraper health
        run: pnpm tsx src/scraper/health-check.ts

  telegram:
    runs-on: ubuntu-latest
    needs:
      - scrape-buzz
      - scrape-officeshoes
      - scrape-djaksport
      - scrape-nsport
      - scrape-sportvision
      - scrape-intersport
      - scrape-trefsport
    if: always()
    # Best-effort: posting deals is secondary to scraping, so a Telegram/network hiccup
    # must never mark the whole Nightly Scrape run as failed (the script already retries).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - name: Post top deals to Telegram
        run: pnpm tsx src/scraper/telegram-post.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
