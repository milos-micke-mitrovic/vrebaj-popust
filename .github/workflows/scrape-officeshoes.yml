name: Scrape OfficeShoes

on:
  # Second daily run a few hours after the nightly. OfficeShoes intermittently blocks the
  # GitHub Actions IP around the ~03:00 UTC nightly window (navigation timeout → 0 deals),
  # but a retry a few hours later gets through — so this self-heals it without a manual
  # re-run. When the nightly succeeded, this just harmlessly refreshes the catalog.
  schedule:
    # Offset minute (not :00): GitHub delays/drops on-the-hour scheduled runs under load,
    # which is why the first attempts at '0 9' never fired. ~09:19 UTC is still well inside
    # the post-block clear window.
    - cron: '19 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'list_only'
          - 'details_only'

# Scrapers write to Cloudflare D1 via the authenticated /api/ingest endpoint.
env:
  INGEST_URL: ${{ secrets.INGEST_URL }}
  INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

jobs:
  scrape-list:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'both' || inputs.mode == 'list_only' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run OfficeShoes scraper
        run: pnpm tsx src/scraper/stores/officeshoes.ts
        timeout-minutes: 30

  scrape-details:
    runs-on: ubuntu-latest
    needs: scrape-list
    if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'both') && needs.scrape-list.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run OfficeShoes Details
        run: pnpm tsx src/scraper/stores/officeshoes-details.ts
        timeout-minutes: 45

  scrape-details-only:
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'details_only' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install
      - run: pnpm prisma generate
      - run: npx puppeteer browsers install chrome
      - name: Run OfficeShoes Details
        run: pnpm tsx src/scraper/stores/officeshoes-details.ts
        timeout-minutes: 45
